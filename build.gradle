plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// Optional at runtime: compile the guarded RP-VCA adapter against its public API only.
	compileOnly files("../rp-voice-additions/build/devlibs/rp-vca-1.0.0-dev.jar")
	
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}

	// Blockbench keeps the supplied source models byte-for-byte intact. Minecraft's
	// model loader only understands axis/angle rotations, so normalize the few
	// single-axis Euler rotations in the generated resources, never in the sources.
	doLast {
		def modelPaths = [
			"assets/terranexus/models/block/management_computer.json",
			"assets/terranexus/models/block/time_clock_terminal.json",
			"assets/terranexus/models/item/mobile_phone.json",
			"assets/terranexus/models/item/mobile_phone_green.json",
			"assets/terranexus/models/item/mobile_phone_red.json"
		]
		def jsonSlurper = new groovy.json.JsonSlurper()
		modelPaths.each { modelPath ->
			def modelFile = new File(destinationDir, modelPath)
			if (!modelFile.isFile()) {
				return
			}
			def model = jsonSlurper.parse(modelFile)
			def changed = false
			def timeClock = modelPath.endsWith("/time_clock_terminal.json")
			def textureRoot = timeClock
				? "terranexus:block/time_clock_terminal/"
				: modelPath.contains("/block/") ? "terranexus:block/management_computer/"
				: "terranexus:item/mobile_phone/"
			model.textures?.replaceAll { key, value ->
				if (value in ["rgb_tablet", "tasten", "rgb_sheet", "Stempeluhr"]) {
					changed = true
					return textureRoot + (value == "Stempeluhr" ? "stempeluhr" : value)
				}
				value
			}
			model.elements?.each { element ->
				if (timeClock && element.faces instanceof Map) {
					def filteredFaces = element.faces.findAll { direction, face -> face.texture != "#missing" }
					if (filteredFaces.size() != element.faces.size()) {
						element.faces = filteredFaces
						changed = true
					}
				}
				def rotation = element.rotation
				if (rotation instanceof Map && !rotation.containsKey("axis")) {
					def axes = ["x", "y", "z"].findAll {
						rotation[it] instanceof Number && rotation[it].doubleValue() != 0.0d
					}
					if (axes.isEmpty()) {
						element.remove("rotation")
						changed = true
					} else if (axes.size() == 1) {
						def axis = axes.first()
						def angle = rotation[axis].doubleValue()
						if (axis == "x" && Math.abs(angle) == 90.0d) {
							def origin = rotation.origin.collect { (it as Number).doubleValue() }
							def points = []
							[element.from[0], element.to[0]].each { x ->
								[element.from[1], element.to[1]].each { y ->
									[element.from[2], element.to[2]].each { z ->
										def sign = angle > 0 ? 1.0d : -1.0d
										points << [
											(x as Number).doubleValue(),
											origin[1] - sign * ((z as Number).doubleValue() - origin[2]),
											origin[2] + sign * ((y as Number).doubleValue() - origin[1])
										]
									}
								}
							}
							element.from = (0..2).collect { coordinate -> points.collect { it[coordinate] }.min() }
							element.to = (0..2).collect { coordinate -> points.collect { it[coordinate] }.max() }
							def directions = angle > 0
								? [north: "up", up: "south", south: "down", down: "north", east: "east", west: "west"]
								: [north: "down", down: "south", south: "up", up: "north", east: "east", west: "west"]
							def rotatedFaces = [:]
							element.faces.each { direction, face ->
								if (face.cullface) face.cullface = directions[face.cullface] ?: face.cullface
								rotatedFaces[directions[direction] ?: direction] = face
							}
							element.faces = rotatedFaces
							element.remove("rotation")
						} else {
							while (angle > 45.0d) angle -= 180.0d
							while (angle < -45.0d) angle += 180.0d
							element.rotation = [
								angle: angle,
								axis: axis,
								origin: rotation.origin
							]
						}
						changed = true
					} else if (timeClock) {
						def origin = rotation.origin.collect { (it as Number).doubleValue() }
						def radians = ["x", "y", "z"].collect {
							Math.toRadians(rotation[it] instanceof Number ? rotation[it].doubleValue() : 0.0d)
						}
						def rotate = { point, translate ->
							def x = (point[0] as Number).doubleValue() - (translate ? origin[0] : 0.0d)
							def y = (point[1] as Number).doubleValue() - (translate ? origin[1] : 0.0d)
							def z = (point[2] as Number).doubleValue() - (translate ? origin[2] : 0.0d)
							def y1 = y * Math.cos(radians[0]) - z * Math.sin(radians[0])
							def z1 = y * Math.sin(radians[0]) + z * Math.cos(radians[0])
							def x2 = x * Math.cos(radians[1]) + z1 * Math.sin(radians[1])
							def z2 = -x * Math.sin(radians[1]) + z1 * Math.cos(radians[1])
							def x3 = x2 * Math.cos(radians[2]) - y1 * Math.sin(radians[2])
							def y3 = x2 * Math.sin(radians[2]) + y1 * Math.cos(radians[2])
							[x3 + (translate ? origin[0] : 0.0d),
							 y3 + (translate ? origin[1] : 0.0d),
							 z2 + (translate ? origin[2] : 0.0d)]
						}
						def points = []
						[element.from[0], element.to[0]].each { x ->
							[element.from[1], element.to[1]].each { y ->
								[element.from[2], element.to[2]].each { z -> points << rotate([x, y, z], true) }
							}
						}
						def rounded = { value -> Math.round(value * 100000.0d) / 100000.0d }
						element.from = (0..2).collect { coordinate -> rounded(points.collect { it[coordinate] }.min()) }
						element.to = (0..2).collect { coordinate -> rounded(points.collect { it[coordinate] }.max()) }
						def normals = [north: [0, 0, -1], south: [0, 0, 1], west: [-1, 0, 0],
									 east: [1, 0, 0], down: [0, -1, 0], up: [0, 1, 0]]
						def rotatedFaces = [:]
						element.faces.each { direction, face ->
							def normal = rotate(normals[direction], false)
							def target = normals.max { candidate ->
								def candidateNormal = candidate.value
								normal[0] * candidateNormal[0] + normal[1] * candidateNormal[1] + normal[2] * candidateNormal[2]
							}.key
							rotatedFaces[target] = face
						}
						element.faces = rotatedFaces
						element.remove("rotation")
						changed = true
					}
				}
			}
			if (changed) {
				modelFile.setText(groovy.json.JsonOutput.toJson(model), "UTF-8")
			}
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

sourceSets {
	layoutTest {
		java.srcDir "src/layoutTest/java"
		compileClasspath += sourceSets.main.output + configurations.testCompileClasspath
		runtimeClasspath += output + compileClasspath + configurations.testRuntimeClasspath
	}
}

tasks.register("testResponsiveLayout", JavaExec) {
	group = "verification"
	description = "Validates the admin desktop layout at supported resolutions and GUI scales."
	dependsOn layoutTestClasses
	classpath = sourceSets.layoutTest.runtimeClasspath
	mainClass = "net.evarius.terranexus.client.gui.AdminDesktopLayoutGeometryTest"
}

tasks.register("testEconomyMessengerPolicies", JavaExec) {
	group = "verification"
	description = "Validates temporary messenger retention and ATM banknote denomination rules."
	dependsOn layoutTestClasses
	classpath = sourceSets.layoutTest.runtimeClasspath
	mainClass = "net.evarius.terranexus.EconomyMessengerPolicyTest"
}

check.dependsOn testResponsiveLayout
check.dependsOn testEconomyMessengerPolicies

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
